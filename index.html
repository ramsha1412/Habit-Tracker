<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Habit Tracker</h1>
    <hr>
    <button id="add-btn">+ Add Habit</button>
    <div id="box">
        <div id="div">
            <h2 id="habit">Habit</h2>
            <ul id="list"></ul>
        </div>
        <div id="days">
            <div id="sun">
                <h2>Sunday</h2>
                <ul class="li"></ul>
            </div>
            <div id="mon">
                <h2>Monday</h2>
                <ul class="li"></ul>
            </div>
            <div id="tue">
                <h2>Tuesday</h2>
                <ul class="li"></ul>
            </div>
            <div id="wed">
                <h2>Wednesday</h2>
                <ul class="li"></ul>
            </div>
            <div id="thu">
                <h2>Thursday</h2>
                <ul class="li"></ul>
            </div>
            <div id="fri">
                <h2>Friday</h2>
                <ul class="li"></ul>
            </div>
            <div id="sat">
                <h2>Saturday</h2>
                <ul class="li"></ul>
            </div>
        </div>
    </div>
    <div id="input-box">
        <h2>Habit</h2>
        <input type="text" id="habit-input" placeholder="Write a new habit...">
        <button id="new-habit-btn">Add</button>
         <p id="empty-message" style="display:none; color:red;">Please write a new habit.</p>
    </div>
</body>
<script src="script.js"></script>
</html>
